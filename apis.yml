aid: stanmore-resources

name: Stanmore Resources

description: 'Stanmore Resources Limited (ASX: SMR) is an Australian mining company with operations and
  exploration projects in Queensland''s Bowen Basin, and one of Australia''s largest suppliers of metallurgical
  coal to global markets, primarily for steel making. Its three producing assets are South Walker Creek,
  Poitrel and the Isaac Plains Complex, with a combined capacity of roughly 14 million tonnes a year,
  plus development projects at Eagle Downs, Lancewood and the Isaac Downs Extension. The company publishes
  no public API or developer portal on its website.'

